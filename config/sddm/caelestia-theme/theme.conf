#! ======================= CONFIG FOR MINIMALISTV2 ===========================
[General]
# ============================================================================
# WELCOME MESSAGE
# ============================================================================
# Enable welcome message [true | false]
enableWelcomeMessage=false

# Custom welcome text (use $USER for username, use empty "" for no text )
welcomeMessage="Welcome $USER"

# ============================================================================
# CARD
# ============================================================================
# UI Elements Radius (inputs, combo boxes, toast)
elementRadius=25

# Login Card Radius
cardRadius=75

# Avatar shape [circle | clamshell | cookie | random]
avatarShape=random

# Card border [true | false]
cardBorder=false

# Card frosted glass blur [true | false]
cardBlurEnabled=true

# Card blur strength [0.0 to 1.0]
cardBlurStrength=0.80

# Outer card opacity [0.50 to 1] (minimum 0.50 for visibility)
outerCardOpacity=0.80

# Inner card opacity [0.15 to 1] (minimum 0.15 for visibility)
innerCardOpacity=0.50

# Element opacity — inputs, dropdowns [0.1 to 1] (minimum 0.1 for visibility)
elementOpacity=0.50

# Card drop shadows [true | false]
dropShadows=true

# ============================================================================
# BACKGROUND
# ============================================================================
# Background blur [true | false]
blurEnabled=true

# Background blur strength [0.0 to 1.0]
blurStrength=0.50

# Background overlay opacity [0 to 1]
overlayOpacity=0.4

# Video wallpaper playback (requires qt6-multimedia) [true | false]
# Place a video at assets/background.mp4 (or .webm/.mkv/.mov/.m4v/.avi)
backgroundVideoEnabled=true

# ============================================================================
# DEBUG
# ============================================================================
# Debug mode (enable debug keyboard shortcuts) [true | false]
debugMode=false

# ============================================================================
# COLOR SCHEME
# ============================================================================
#! Kanagawa color palette (matches Noctalia builtin "Kanagawa", dark)
mPrimary=#76946A
mOnPrimary=#1F1F28

mSecondary=#C0A36E
mOnSecondary=#1F1F28

mTertiary=#7E9CD8
mOnTertiary=#1F1F28

mError=#C34043
mOnError=#1F1F28

mSurface=#1F1F28
mOnSurface=#C8C093

mSurfaceVariant=#2A2A37
mOnSurfaceVariant=#717C7C

mSurfaceContainer=#16161D

mOutline=#454551
mShadow=#0D0C0C

mHover=#76946A
mOnHover=#1F1F28
