[general]
import = [
    # static fallback, overridden by the Caelestia scheme once it is rendered
    "~/.config/alacritty/themes/noctalia.toml",
    "~/.local/state/caelestia/theme/alacritty.toml",
]

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[window]
padding = { x = 2, y = 2 }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
