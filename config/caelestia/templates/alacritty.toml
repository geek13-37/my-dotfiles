# Rendered by caelestia-cli into ~/.local/state/caelestia/theme/alacritty.toml
# on every scheme change; alacritty imports it and reloads live.
# Same mapping as Caelestia's own terminal sequences.

[colors.primary]
background = '#{{ surface.hex }}'
foreground = '#{{ onSurface.hex }}'

[colors.cursor]
text   = '#{{ surface.hex }}'
cursor = '#{{ secondary.hex }}'

[colors.vi_mode_cursor]
text   = '#{{ surface.hex }}'
cursor = '#{{ primary.hex }}'

[colors.search.matches]
foreground = '#{{ surface.hex }}'
background = '#{{ tertiary.hex }}'

[colors.search.focused_match]
foreground = '#{{ onPrimary.hex }}'
background = '#{{ primary.hex }}'

[colors.footer_bar]
foreground = '#{{ onSurface.hex }}'
background = '#{{ surfaceContainerHigh.hex }}'

[colors.hints.start]
foreground = '#{{ onPrimary.hex }}'
background = '#{{ primary.hex }}'

[colors.hints.end]
foreground = '#{{ onSecondary.hex }}'
background = '#{{ secondary.hex }}'

[colors.selection]
text       = '#{{ onSurface.hex }}'
background = '#{{ surfaceContainerHighest.hex }}'

[colors.normal]
black   = '#{{ term0.hex }}'
red     = '#{{ term1.hex }}'
green   = '#{{ term2.hex }}'
yellow  = '#{{ term3.hex }}'
blue    = '#{{ term4.hex }}'
magenta = '#{{ term5.hex }}'
cyan    = '#{{ term6.hex }}'
white   = '#{{ term7.hex }}'

[colors.bright]
black   = '#{{ term8.hex }}'
red     = '#{{ term9.hex }}'
green   = '#{{ term10.hex }}'
yellow  = '#{{ term11.hex }}'
blue    = '#{{ term12.hex }}'
magenta = '#{{ term13.hex }}'
cyan    = '#{{ term14.hex }}'
white   = '#{{ term15.hex }}'
