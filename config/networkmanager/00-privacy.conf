# Installed to /etc/NetworkManager/conf.d/ by install.sh.
# Defaults for every connection, so other networks can't track this machine.

[device]
# random MAC while scanning for Wi-Fi (NM's default, kept explicit)
wifi.scan-rand-mac-address=yes

[connection]
# "stable" = a different fake MAC per network that stays the same for it, so
# DHCP leases and captive portals keep working ("random" = new one each time)
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
# don't announce the hostname to the network's DHCP server
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# temporary IPv6 addresses instead of one derived from the MAC
ipv6.ip6-privacy=2
