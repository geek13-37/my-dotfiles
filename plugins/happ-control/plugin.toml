# Happ Control - status indicator and launcher for the Happ proxy client.
#
# Happ ships two separate things on Linux: a per-user Electron GUI (/opt/happ/bin/Happ)
# and a root systemd service (happd.service) that actually owns the Xray core and the
# TUN tunnel. Closing or killing the GUI does NOT disconnect the tunnel, and Happ
# publishes no public CLI/D-Bus/HTTP API to drive connect/disconnect/server-switch from
# outside the app (checked: happ-desktop repo ships no source, and happ.su's dev-docs
# only cover subscription-link generation, not app remote control). happd does listen on
# a local socket (/tmp/happd.sock) but its protocol is undocumented and proprietary, so
# this plugin does not attempt to drive it.
#
# What this plugin *can* do reliably: report whether the GUI is running and whether
# Happ's local SOCKS port is accepting connections (a good proxy for "tunnel is up"),
# show the last-used server name (read from ~/.config/Happ.conf), and launch/focus the
# GUI so you can connect/disconnect/switch servers by hand.

id = "andrey/happ-control"
name = "Happ Control"
version = "1.0.0"
plugin_api = 9
author = "andrey"
license = "MIT"
tags = ["proxy", "network", "vpn"]
icon = "shield-lock"
description = "Status indicator and quick launcher for the Happ proxy client."

[[setting]]
key = "process_match"
type = "string"
label_key = "settings.process_match.label"
description_key = "settings.process_match.description"
default = "happ"

[[setting]]
key = "launch_command"
type = "string"
label_key = "settings.launch_command.label"
description_key = "settings.launch_command.description"
default = "happ"

[[setting]]
key = "socks_port"
type = "int"
label_key = "settings.socks_port.label"
description_key = "settings.socks_port.description"
default = 10808
min = 1
max = 65535

[[setting]]
key = "poll_interval_ms"
type = "int"
label_key = "settings.poll_interval_ms.label"
description_key = "settings.poll_interval_ms.description"
default = 4000
min = 1000
max = 60000
step = 500

# Headless service: polls process + port state and publishes it via noctalia.state,
# so both the bar widget and the control-center tile stay in sync without polling twice.
[[service]]
id = "monitor"
entry = "monitor.luau"

# Bar tile showing connection state; click launches/focuses the Happ GUI.
[[widget]]
id = "status"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_server_name"
  type = "bool"
  label_key = "settings.show_server_name.label"
  description_key = "settings.show_server_name.description"
  default = false

  [[widget.setting]]
  key = "connected_glyph"
  type = "glyph"
  label_key = "settings.connected_glyph.label"
  description_key = "settings.connected_glyph.description"
  default = "shield-check"

  [[widget.setting]]
  key = "disconnected_glyph"
  type = "glyph"
  label_key = "settings.disconnected_glyph.label"
  description_key = "settings.disconnected_glyph.description"
  default = "shield-x"

  [[widget.setting]]
  key = "connected_color"
  type = "color"
  label_key = "settings.connected_color.label"
  description_key = "settings.connected_color.description"
  default = "primary"

  [[widget.setting]]
  key = "disconnected_color"
  type = "color"
  label_key = "settings.disconnected_color.label"
  description_key = "settings.disconnected_color.description"
  default = "on_surface"

# Control-center tile mirroring the same state and action.
[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
